<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<!-- 규식이 아이콘: 선로도(railroad diagram)의 갈라지는 선로 — 왼쪽 점에서 두 노드로 갈라졌다가 오른쪽 점에서 합쳐진다 -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4C74F0"/>
			<stop offset="1" stop-color="#2540B8"/>
		</linearGradient>
	</defs>
	<rect width="256" height="256" rx="58" fill="url(#bg)"/>
	<g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
		<!-- 갈라지는 선로 -->
		<path d="M46 128H62C76 128 76 86 94 86"/>
		<path d="M46 128H62C76 128 76 170 94 170"/>
		<!-- 합쳐지는 선로 -->
		<path d="M210 128H194C180 128 180 86 162 86"/>
		<path d="M210 128H194C180 128 180 170 162 170"/>
	</g>
	<!-- 양 끝 점 -->
	<circle cx="40" cy="128" r="16" fill="#FFFFFF"/>
	<circle cx="216" cy="128" r="16" fill="#FFFFFF"/>
	<!-- 위·아래 노드 -->
	<rect x="90" y="58" width="76" height="56" rx="18" fill="#FFFFFF"/>
	<rect x="90" y="142" width="76" height="56" rx="18" fill="#FFFFFF"/>
</svg>
